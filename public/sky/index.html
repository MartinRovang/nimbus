<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nimbus sky</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0620; overflow: hidden; }
  .scene {
    position: absolute; inset: 0; margin: auto;
    width: max(100vw, 100vh * 1672 / 941);   /* cover, not letterbox: it is a background */ aspect-ratio: 1672 / 941;
    background: url(layer_bg.webp) center / cover; overflow: hidden;
    container-type: inline-size;   /* lets keyframes use scene width (cqw) */
  }
  .cloud {
    position: absolute; left: 0;
    animation: drift 60s steps(1200) infinite; /* 20 fps: they drift ~32px/s, and every frame is a repaint here */
    /* the glow (6/24/60px drop-shadows, pink to violet) is baked into the images: WebKitGTK repaints a CSS filter on every frame, a core's worth */
  }
  /* same loop as render_gif.py: enter fully off-left, exit fully off-right, 60s */
  @keyframes drift { from { transform: translateX(-100%); } to { transform: translateX(100cqw); } }
  @media (prefers-reduced-motion: reduce) { .cloud { animation-play-state: paused; } }
</style>
</head>
<body>
<div class="scene">
  <img class="cloud" src="clouds/c7.webp" style="width:23.33%;top:-4.29%;animation-delay:-12s">
  <img class="cloud" src="clouds/c8.webp" style="width:18.36%;top:11.69%;animation-delay:-42s">
  <img class="cloud" src="clouds/c0.webp" style="width:57.37%;top:-11.32%;animation-delay:-6s">
  <img class="cloud" src="clouds/c1.webp" style="width:43.36%;top:1.68%;animation-delay:-36s">
  <img class="cloud" src="clouds/c5.webp" style="width:35.41%;top:17.64%;animation-delay:-24s">
  <img class="cloud" src="clouds/c3.webp" style="width:49.41%;top:9.64%;animation-delay:0s">
  <img class="cloud" src="clouds/c6.webp" style="width:39.37%;top:27.68%;animation-delay:-30s">
  <img src="layer_fg.webp" style="position:absolute;left:0;top:0;height:100%">
</div>
</body>
</html>
