<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report</title>
<!-- Nimbus report page: renders REPORT.json (nimbus.onData). Claude edits the JSON, not this file. -->
<style>
:root{--bg:oklch(0.16 0.008 250);--card:oklch(0.19 0.009 250);--hover:oklch(0.21 0.01 250);--line:oklch(0.28 0.01 250);--line2:oklch(0.25 0.01 250);--text:oklch(0.92 0.005 250);--hi:oklch(0.97 0.004 250);--mid:oklch(0.72 0.01 250);--dim:oklch(0.6 0.01 250);--faint:oklch(0.5 0.01 250);
--accent:oklch(0.78 0.13 290);--ok:oklch(0.78 0.14 150);--warn:oklch(0.82 0.13 75);--bad:oklch(0.7 0.17 25);--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'IBM Plex Sans','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:28px 24px 64px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.cap{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
header{display:flex;flex-direction:column;gap:14px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font:12px var(--mono);color:oklch(0.65 0.01 250)}
.chip{padding:1px 8px;border:1px solid oklch(0.32 0.01 250);border-radius:3px;color:oklch(0.85 0.01 250)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px}
h1{margin:0;font:700 26px var(--mono);letter-spacing:-.02em;color:var(--hi)}
.bar{height:6px;background:oklch(0.25 0.01 250);border-radius:1px;overflow:hidden}.bar>div{height:100%;background:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.metrics>div{background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}main{flex:1 1 580px;min-width:0}aside{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
.stage{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}.rail{display:flex;flex-direction:column;align-items:center}
.node{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font:700 11px var(--mono)}
.rail>i{flex:1;width:2px;min-height:16px}
.card{border:1px solid var(--line);background:var(--card);border-radius:4px}
summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary:hover{background:var(--hover)}
details[open] .chev{transform:rotate(90deg)}.chev{display:inline-block;width:10px}
.tag{font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:2px}
.body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line2)}
.grid2{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:13px;padding:2px 0}
.tbl{border:1px solid oklch(0.27 0.01 250);border-radius:3px;overflow-x:auto;font:12px var(--mono)}
.tbl>div{display:grid;grid-template-columns:minmax(160px,1fr) 56px 56px 56px 72px;gap:8px;padding:6px 10px;border-top:1px solid var(--line2);min-width:440px}
.tbl>div:first-child{border:0;background:oklch(0.22 0.01 250);color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.tbl>div.tot{background:var(--hover);font-weight:700}.tbl span+span{text-align:right}
.rev{display:grid;grid-template-columns:120px 150px minmax(0,1fr);gap:10px;align-items:baseline;font-size:13px;padding:6px 10px;background:var(--hover);border-radius:3px}
.pr{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px dashed oklch(0.35 0.01 250);border-radius:3px}
.box{border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.risk{border-color:oklch(0.45 0.12 60);background:oklch(0.2 0.02 60)}
.log{background:oklch(0.14 0.008 250);font:12px var(--mono);gap:4px}.log>div:not(.cap){display:grid;grid-template-columns:44px 64px minmax(0,1fr);gap:8px}
.empty{color:var(--dim);font:13px var(--mono);padding:40px 0;text-align:center}
@media (max-width:600px){body{padding:20px 16px 48px}.rev{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">No REPORT.json yet.</div></div>
<script>
// status: done | active | pending | blocked | failed; review verdicts: requested | approved | changes | commented
const S = {
  done: ["done", "✓", "var(--ok)"], active: ["in progress", "●", "var(--accent)"], pending: ["pending", "", "var(--faint)"],
  blocked: ["blocked", "!", "var(--warn)"], failed: ["failed", "✕", "var(--bad)"],
  requested: ["requested", "○", "var(--dim)"], approved: ["approved", "✓", "var(--ok)"], changes: ["changes requested", "✕", "var(--bad)"], commented: ["commented", "…", "var(--accent)"],
};
const st = (k) => S[k] || S.pending;
const tint = (c, a = 0.15) => `color-mix(in oklch, ${c} ${a * 100}%, transparent)`;
const TREND = { good: "var(--ok)", bad: "var(--bad)" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const url = (u) => /^(https?:|#|\.?\/)/.test(u || "") ? esc(u) : "#";
const each = (xs, f) => (xs || []).map(f).join("");

const task = (t) => `<div class="grid2"><span class="mono" style="color:${t.done ? "var(--ok)" : "var(--faint)"}">${t.done ? "[x]" : "[&nbsp;]"}</span><span style="color:${t.done ? "var(--mid)" : "var(--text)"}">${esc(t.text)}</span></div>`;

function stage(s, i, all) {
  const [label, glyph, c] = st(s.status), last = i === all.length - 1;
  const tasks = s.tasks || [], tests = s.tests || [], prs = s.prs || (s.pr ? [s.pr] : []);
  const tot = tests.reduce((a, r) => ({ p: a.p + (r.passed || 0), f: a.f + (r.failed || 0), s: a.s + (r.skipped || 0), d: a.d + (parseFloat(r.duration) || 0) }), { p: 0, f: 0, s: 0, d: 0 });
  const border = { active: "oklch(0.5 0.1 290)", failed: "oklch(0.5 0.12 25)", blocked: "oklch(0.5 0.1 75)" }[s.status] || "var(--line)";
  const when = s.finished ? `${s.started} → ${s.finished}` : s.started ? `since ${s.started}` : "—";
  return `<div class="stage"><div class="rail">
    <div class="node" style="border-color:${c};background:${s.status === "pending" ? "var(--bg)" : s.status === "active" ? "oklch(0.22 0.04 290)" : c};color:${s.status === "active" ? c : "var(--bg)"};${s.status === "active" ? "box-shadow:0 0 0 4px " + tint(c, .18) : ""}">${glyph}</div>
    <i style="background:${s.status === "done" ? "var(--ok)" : "oklch(0.35 0.01 250)"};opacity:${last ? 0 : 1}"></i></div>
  <div style="padding-bottom:18px;min-width:0"><details class="card" style="border-color:${border}" ${s.status === "done" ? "" : "open"}>
    <summary><span class="mono" style="font-size:11px;color:var(--faint)">${String(i + 1).padStart(2, "0")}</span>
      <span class="mono" style="font-size:15px;font-weight:700;color:var(--hi)">${esc(s.name)}</span>
      <span class="tag" style="color:${c};background:${tint(c)}">${label}</span>
      <span class="mono" style="margin-left:auto;font-size:11px;color:var(--dim)">${esc(when)}</span><span class="mono chev" style="font-size:11px;color:var(--faint)">▸</span></summary>
    <div class="body">
      ${s.summary ? `<p style="margin:10px 0 0;color:oklch(0.78 0.01 250)">${esc(s.summary)}</p>` : ""}
      ${tasks.length ? `<div><div class="mono" style="font-size:11px;color:var(--dim);padding-bottom:4px">tasks ${tasks.filter((t) => t.done).length}/${tasks.length}</div>
        ${each(tasks, task)}</div>` : ""}
      ${tests.length ? `<div class="tbl"><div><span>suite</span><span>pass</span><span>fail</span><span>skip</span><span>time</span></div>
        ${each(tests, (r) => `<div><span style="display:flex;gap:8px;min-width:0"><span style="color:${r.failed ? "var(--bad)" : "var(--ok)"}">${r.failed ? "✕" : "✓"}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.suite)}</span></span>
          <span style="color:var(--ok)">${r.passed || 0}</span><span style="color:${r.failed ? "var(--bad)" : "var(--faint)"}">${r.failed || 0}</span><span style="color:var(--faint)">${r.skipped || 0}</span><span style="color:var(--dim)">${esc(r.duration)}</span></div>`)}
        <div class="tot"><span style="color:var(--mid)">total</span><span style="color:var(--ok)">${tot.p}</span><span style="color:${tot.f ? "var(--bad)" : "var(--faint)"}">${tot.f}</span><span style="color:var(--faint)">${tot.s}</span><span style="color:var(--dim)">${tot.d.toFixed(1)}s</span></div></div>` : ""}
      ${(s.reviews || []).length ? `<div style="display:flex;flex-direction:column;gap:6px">${each(s.reviews, (v) => { const [l, g, vc] = st(v.verdict); return `<div class="rev"><span class="mono">@${esc(v.who)}</span><span class="mono" style="font-size:11px;color:${vc}">${g} ${l}</span><span style="color:var(--mid)">${esc(v.note)}</span></div>`; })}</div>` : ""}
      ${each(prs, (p) => `<div class="pr"><div style="display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline">
          <a class="mono" style="font-weight:700" href="${url(p.url)}">${esc(p.repo ? p.repo + "#" : "#")}${esc(p.number)}</a><span>${esc(p.title)}</span>
          <span class="mono" style="margin-left:auto;font-size:11px;color:var(--dim)">${esc(p.base)} ← ${esc(p.head)}${p.additions != null ? ` · +${p.additions} −${p.deletions}` : ""}</span></div>
        ${(p.checks || []).length ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${each(p.checks, (k) => { const [, g, kc] = st(k.status); return `<span class="mono" style="font-size:11px;padding:2px 8px;border-radius:2px;color:${kc};background:${tint(kc)}">${g || "○"} ${esc(k.name)}</span>`; })}</div>` : ""}</div>`)}
    </div></details></div></div>`;
}

function render(R) {
  const app = document.getElementById("app");
  if (!R) return;
  const P = R.project || {}, stages = R.stages || [];
  const tasks = R.tasks || [], lite = !stages.length, tdone = tasks.filter((t) => t.done).length; // no stages: a workfolder report (set_report), its tasks stand in for the pipeline
  const score = stages.reduce((a, s) => a + (s.status === "done" ? 1 : s.status === "pending" ? 0 : 0.5), 0), pct = lite ? (tasks.length ? Math.round(tdone / tasks.length * 100) : 0) : Math.round(score / stages.length * 100);
  const doneN = stages.filter((s) => s.status === "done").length, cur = stages.find((s) => s.status !== "done");
  const worst = ["failed", "blocked", "active"].find((k) => stages.some((s) => s.status === k)) || (stages.length && doneN === stages.length ? "done" : "pending");
  const box = (title, color, body, cls = "") => `<div class="box ${cls}"><div class="cap" style="color:${color}">${title}</div>${body}</div>`;
  app.innerHTML = `<header>
    <div class="crumbs"><span style="color:var(--accent)">$</span>${each(P.repos, (r) => `<span>${esc(r.name || r)}</span>${r.branch ? `<span style="color:oklch(0.45 0.01 250)">/</span><span class="chip">${esc(r.branch)}</span>` : ""}`)}
      <span style="margin-left:auto">${P.updated ? "updated " + esc(P.updated) : ""}${P.owner ? " · by " + esc(P.owner) : ""}</span></div>
    <div class="top"><div style="flex:1 1 420px;display:flex;flex-direction:column;gap:6px;min-width:0"><h1>${esc(P.name)}</h1><p style="margin:0;color:var(--mid);max-width:72ch">${esc(P.summary)}</p></div>
      ${lite && !tasks.length ? "" : `<div class="mono" style="flex:0 1 320px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:oklch(0.7 0.01 250)">${lite ? "<span>tasks</span>" : `<span>overall · <span style="color:${st(worst)[2]}">${worst === "active" ? "on track" : st(worst)[0]}</span></span>`}<span style="color:var(--hi);font-weight:700">${pct}%</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div style="font-size:11px;color:var(--faint)">${lite ? `${tdone}/${tasks.length} tasks done` : `${doneN}/${stages.length} stages done${cur ? " · now: " + esc(cur.name) : ""}`}</div></div>`}</div></header>
  ${(R.metrics || []).length ? `<section class="metrics">${each(R.metrics, (m) => `<div><span class="cap">${esc(m.label)}</span>
    <div style="display:flex;align-items:baseline;gap:10px"><span class="mono" style="font-size:22px;font-weight:700;color:var(--hi)">${esc(m.value)}</span><span class="mono" style="font-size:12px;color:${TREND[m.trend] || "var(--dim)"}">${esc(m.delta)}</span></div>
    <span style="font-size:12px;color:var(--dim)">${esc(m.note)}</span></div>`)}</section>` : ""}
  <div class="cols">${lite ? (tasks.length ? `<main><div class="cap" style="padding-bottom:8px">Tasks</div>${each(tasks, task)}</main>` : "") : `<main><div class="cap" style="padding:0 0 12px 40px">Pipeline · ${stages.length} stages</div>${stages.map(stage).join("")}</main>`}
  <aside>
    ${(R.blockers || []).length ? box(`▲ Blockers &amp; risks · ${R.blockers.length}`, "var(--warn)", each(R.blockers, (b) => typeof b === "string" ? `<div style="font-size:13px">${esc(b)}</div>` : `<div style="display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:13px">
      <span class="mono" style="font-size:10px;font-weight:700;text-transform:uppercase;padding-top:2px;color:${b.severity === "high" ? "var(--bad)" : "var(--warn)"}">${esc(b.severity)}</span>
      <div style="display:flex;flex-direction:column"><span>${esc(b.text)}</span><span class="mono" style="font-size:11px;color:var(--dim)">${esc(b.kind)}${b.owner ? " · owner @" + esc(b.owner) : ""}</span></div></div>`), "risk") : ""}
    ${(R.questions || []).length ? box("? Questions for you", "var(--warn)", each(R.questions, (q, i) => `<div class="grid2"><span class="mono" style="color:var(--faint)">${i + 1}.</span><span>${esc(q)}</span></div>`)) : ""}
    ${(R.consider || []).length ? box("◆ To consider", "var(--accent)", each(R.consider, (t) => `<div class="grid2"><span class="mono" style="color:var(--faint)">·</span><span>${esc(t)}</span></div>`)) : ""}
    ${(R.next || []).length ? box("→ Next steps", "var(--accent)", each(R.next, (t, i) => `<div class="grid2"><span class="mono" style="color:var(--faint)">${i + 1}.</span><span>${esc(t)}</span></div>`)) : ""}
    ${(R.decisions || []).length ? box("Decisions", "var(--dim)", each(R.decisions, (d) => `<div style="display:flex;flex-direction:column;gap:2px;font-size:13px"><span class="mono" style="font-size:11px;color:var(--faint)">${esc(d.date)}</span><span style="font-weight:500">${esc(d.text)}</span>${d.why ? `<span style="color:oklch(0.65 0.01 250)">why: ${esc(d.why)}</span>` : ""}</div>`)) : ""}
    ${each(R.sections, (s) => box(esc(s.title), "var(--dim)", each(s.items, (t) => `<div class="grid2"><span class="mono" style="color:var(--faint)">·</span><span>${esc(t)}</span></div>`)))}
    ${(R.links || []).length ? box("Links", "var(--dim)", each(R.links, (l) => `<div class="mono" style="display:flex;justify-content:space-between;gap:10px;font-size:12px"><span style="color:var(--dim)">${esc(l.label)}</span><a href="${url(l.url)}" target="_blank" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.short || l.url)} ↗</a></div>`)) : ""}
    ${(R.activity || []).length ? box("Activity log", "var(--dim)", each(R.activity, (a) => `<div><span style="color:var(--faint)">${esc(a.time)}</span><span style="color:${st(a.status)[2]}">${esc(a.stage)}</span><span style="color:oklch(0.8 0.005 250)">${esc(a.text)}</span></div>`), "log") : ""}
  </aside></div>`;
  parent.postMessage({ nimbus: "height", h: document.documentElement.offsetHeight }, "*"); // a frame that fits what it shows (the workfolder home)
}
// ponytail: outside Nimbus (opened in a browser) there is no bridge, so fetch the .json next to it; file:// may block that, then it stays empty
if (window.nimbus) nimbus.onData(render); else fetch("REPORT.json").then((r) => r.json()).then(render).catch(() => {});
</script>
</body>
</html>
